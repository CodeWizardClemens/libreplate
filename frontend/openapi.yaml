components:
  schemas:
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    DayMeal:
      type: object
      description: |-
        Serializer representing a meal slot for a specific day.

        If meal_id is null, the slot has not yet been persisted.
      properties:
        meal_id:
          type: integer
          nullable: true
        default_meal:
          $ref: '#/components/schemas/DefaultMeal'
        name:
          type: string
        date:
          type: string
          format: date
        note:
          type: string
        order:
          type: integer
        meal_foods:
          type: array
          items:
            $ref: '#/components/schemas/MealFood'
      required:
      - date
      - default_meal
      - meal_foods
      - meal_id
      - name
      - note
      - order
    DefaultMeal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        description:
          type: string
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - name
    Food:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        serving:
          type: number
          format: double
        unit_id:
          type: integer
        unit_name:
          type: string
          readOnly: true
        barcode:
          type: string
          nullable: true
          maxLength: 50
        brand:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
        is_favorite:
          type: boolean
        usda_fdc_id:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        tag_ids:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        nutrients:
          type: array
          items:
            $ref: '#/components/schemas/FoodNutrient'
      required:
      - id
      - name
      - serving
      - tags
      - unit_id
      - unit_name
    FoodNutrient:
      type: object
      properties:
        nutrient_id:
          type: integer
        nutrient_name:
          type: string
          readOnly: true
        nutrient_unit:
          type: string
          readOnly: true
        amount:
          type: number
          format: double
      required:
      - amount
