name: Verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: libreplate
          POSTGRES_PASSWORD: unsafe_development_pwd!1
          POSTGRES_DB: libreplate_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U libreplate -d libreplate_db" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Sync dependencies
        run: uv sync

      - name: Create environment file
        run: |
          cp .env_example .env
          sed -i "s|^FRONTEND_DIST=.*|FRONTEND_DIST=${{ github.workspace }}/frontend/dist/|" .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=github-insecure-ci-key|" .env
          sed -i "s|^SESSION_COOKIE_SECURE=.*|SESSION_COOKIE_SECURE=False|" .env
          sed -i "s|^CSRF_COOKIE_SECURE=.*|CSRF_COOKIE_SECURE=False|" .env

      - name: Init LibrePlate
        run: uv run invoke setup.init

      - name: Run verification
        run: uv run invoke dev.verify --verbose

      - name: Build front end
        run: uv run invoke setup.build-front-end

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7